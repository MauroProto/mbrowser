<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Conectar mbrowser</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="options.js"></script>
</head>
<body class="setup-page">
  <main class="setup">
    <img src="icons/icon-48.png" width="48" height="48" alt="">
    <h1>mbrowser</h1>
    <section class="status-card" aria-live="polite">
      <div class="status-line"><span id="status-dot" class="status-dot"></span><h2 id="status-title">Comprobando conexión…</h2></div>
      <p id="status-detail"></p>
    </section>
    <p id="notice" class="notice" hidden></p>
    <p id="feedback" class="feedback" role="status" hidden></p>
    <button type="button" id="show-panel" class="button primary" hidden>Abrir panel</button>
  </main>
</body>
</html>
