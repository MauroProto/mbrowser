<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>mbrowser</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="panel.js"></script>
</head>
<body class="activity-panel">
  <header class="brand">
    <img src="icons/icon-48.png" width="36" height="36" alt="">
    <h1>mbrowser</h1>
  </header>
  <main>
    <section class="status-card" aria-live="polite">
      <div class="status-line"><span id="status-dot" class="status-dot"></span><h2 id="status-title">Comprobando conexión…</h2></div>
      <p id="status-detail"></p>
    </section>
    <p id="notice" class="notice" hidden></p>
    <div class="actions" id="controls" hidden>
      <button type="button" id="pause" class="button secondary" hidden>Desactivar</button>
      <button type="button" id="resume" class="button primary" hidden>Activar</button>
      <button type="button" id="revoke" class="button quiet" hidden>Desconectar</button>
    </div>
    <p id="feedback" class="feedback" role="status" hidden></p>
    <section class="site-request" id="site-request" aria-labelledby="site-title" hidden>
      <h2 id="site-title">Permitir este sitio</h2>
      <p id="site-origin" class="site-origin"></p>
      <p>El agente podrá leer e interactuar en sus pestañas de este sitio.</p>
      <div class="actions">
        <button type="button" id="allow-site" class="button primary">Permitir</button>
        <button type="button" id="deny-site" class="button secondary">Rechazar</button>
      </div>
    </section>
    <section class="activity" id="activity" aria-labelledby="tabs-title" hidden>
      <h2 id="tabs-title">Pestañas del agente</h2>
      <p id="empty">Todavía no hay actividad.</p>
      <ul id="activity-tabs" class="activity-tabs"></ul>
      <p id="preview-state" role="status" hidden></p>
      <canvas id="preview-frame" aria-label="Pestaña y cursor del agente" hidden></canvas>
    </section>
  </main>
</body>
</html>
